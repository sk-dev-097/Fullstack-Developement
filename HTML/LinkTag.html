<!DOCTYPE html>
<html>
<head>
    <title>My First Links Page</title>
</head>
<body>

    <h1>Learning HTML Links</h1>

    <p>This is a link to Google:</p>
    <a href="https://www.google.com">Click here for Google</a>

    <p>This link opens in a new tab:</p>
    <a href="https://www.wikipedia.org" target="_blank">Visit Wikipedia</a>

    <p>This is a link to an email address:</p>
    <a href="mailto:someone@example.com">Send an Email</a>

    <p>This is a link to another page on the same site:</p>
    <a href="about.html">Go to About Page</a>

</body>
</html>
