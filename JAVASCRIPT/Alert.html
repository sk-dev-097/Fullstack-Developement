<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learning alert()</title>
</head>
<body>

  <h1>JavaScript alert() Demo</h1>
  <p>Open this file in a browser and check the console (F12) too.</p>

  <button onclick="basicAlert()">Basic Alert</button>

  <script>

    function basicAlert() {
      alert("Hello! This is a simple alert box.");
    }

  </script>

</body>
</html>
