<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box-model{
    width:850px;
}

.margin{
    background:#fde6b8;
    border:2px dashed #ff6b35;
    padding:30px;
    text-align:center;
}

.margin-title{
    font-weight:bold;
    color:#b56400;
    margin-bottom:15px;
    letter-spacing:1px;
}

.border{
    background:#ffe9b0;
    border:3px solid orange;
    padding:25px;
}

.border-title{
    color:#a55a00;
    font-weight:bold;
    margin-bottom:15px;
    letter-spacing:1px;
}

.padding{
    background:#cfe8ff;
    border:2px dashed #1e90ff;
    padding:30px;
}

.padding-title{
    color:#0b5ed7;
    font-weight:bold;
    margin-bottom:15px;
    letter-spacing:1px;
}

.content{
    background:#a9d3f2;
    border:2px solid green;
    padding:30px;
}

.content h2{
    color:#0a5c0a;
    margin-bottom:10px;
}

.content p{
    font-size:20px;
    color:#222;
    }
    </style>
</head>
<body>
<div class="box-model">
    <div class="margin">
        <div class="margin-title">MARGIN (CLEARS AREA OUTSIDE BORDER)</div>

        <div class="border">
            <div class="border-title">BORDER (SURROUNDS PADDING & CONTENT)</div>

            <div class="padding">
                <div class="padding-title">
                    PADDING (SPACE BETWEEN BORDER & CONTENT)
                </div>

                <div class="content">
                    <h2>CONTENT AREA</h2>
                    <p>Text, Images, or Nested HTML elements</p>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
